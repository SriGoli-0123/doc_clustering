[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ccst"
version = "0.1.0"
description = "Context-Conditioned Signed Partial Transport for scientific literature (CSE 573 G16)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "networkx>=3.0",
    "POT>=0.9.4",
    "gensim>=4.3",
    "spacy>=3.7",
    "sentence-transformers>=2.6",
    "transformers>=4.40",
    "torch>=2.1",
    "numba>=0.58",
    "rank_bm25>=0.2.2",
    "rouge-score>=0.1.2",
    "bert_score>=0.3.13",
    "igraph>=0.11",
    "leidenalg>=0.10",
    "requests>=2.31",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]
bertopic = ["bertopic>=0.17", "umap-learn>=0.5"]  # item 6 official baseline

[project.scripts]
ccst = "ccst.cli:main"

[tool.setuptools.packages.find]
include = ["ccst*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
